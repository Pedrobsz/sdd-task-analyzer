name: TaskAnalyzer - testes e Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Test Harness - Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar Test Harness
        run: python -m pytest tests/test_harness.py -v

  docker:
    name: Docker Compose - ambiente isolado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Executar testes via Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
