projeto: TaskAnalyzer
contrato: "Fase 1 - versao 1.0 (13/09/2026)"
requisitos:
  python: '>=3.11'
  prioridade: [baixa, média, alta]
  status: [concluída, pendente, cancelada]
  datas: UTC
  data_inicio: obrigatoria
  prazo: obrigatorio
  duracao: "data_conclusao - data_inicio (minutos)"
  atraso: "data_conclusao > prazo para tarefas concluidas"
  taxa_atraso: "concluidas atrasadas / concluidas * 100"
  sem_concluidas: 0.0
  arredondamento: 2
saidas_fase1:
  - quantidade_tarefas
  - tempo_medio_conclusao_min
  - taxa_atraso_percentual
  - indicadores_por_prioridade
adaptador_fase2: resumo_fase2
validacao:
  excecao: TaskValidationError
  politica: rejeitar entrada inconsistente com mensagem clara
observacao: "A politica de rejeicao resolve divergencia entre Fase 1 secao 1.3.3 e Cenario 2/Fase 2."
